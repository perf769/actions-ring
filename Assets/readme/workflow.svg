<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Как Actions Ring выбирает нужное кольцо</title>
  <desc id="desc">Четыре шага: назначенный ввод, выбранный пользовательский профиль, контекст активного приложения и действие либо подменю.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0l10 5-10 5z" fill="#6C7370"/>
    </marker>
  </defs>

  <rect width="1200" height="360" rx="28" fill="#15191C"/>
  <text x="58" y="59" fill="#F4F6F5" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="32" font-weight="700">От ввода к своему набору действий</text>
  <text x="58" y="91" fill="#A9B0AD" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="19">Контекст определяется заново при каждом вызове.</text>

  <g fill="none" stroke="#6C7370" stroke-width="2" marker-end="url(#arrow)">
    <path d="M292 221h40"/><path d="M580 221h40"/><path d="M868 221h40"/>
  </g>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <g transform="translate(44 134)">
      <rect width="248" height="174" rx="22" fill="#20252A" stroke="#363D42"/>
      <circle cx="37" cy="37" r="17" fill="#824EF9"/>
      <path d="M30 37h14M37 30v14" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      <text x="66" y="45" fill="#F4F6F5" font-size="23" font-weight="700">Ввод</text>
      <text x="24" y="92" fill="#CFD4D2" font-size="19">Клавиша, кнопка</text>
      <text x="24" y="120" fill="#CFD4D2" font-size="19">мыши или колесо</text>
      <text x="24" y="151" fill="#8F9894" font-size="17">удерживать / переключать</text>
    </g>

    <g transform="translate(332 134)">
      <rect width="248" height="174" rx="22" fill="#20252A" stroke="#363D42"/>
      <circle cx="37" cy="37" r="17" fill="#65D9B0"/>
      <circle cx="37" cy="33" r="5" fill="#10211C"/>
      <path d="M28 46c2-7 16-7 18 0" fill="none" stroke="#10211C" stroke-width="2.5" stroke-linecap="round"/>
      <text x="66" y="45" fill="#F4F6F5" font-size="23" font-weight="700">Профиль</text>
      <text x="24" y="92" fill="#CFD4D2" font-size="19">Свои приложения,</text>
      <text x="24" y="120" fill="#CFD4D2" font-size="19">кольца и цвета</text>
      <text x="24" y="151" fill="#8F9894" font-size="17">например, Работа</text>
    </g>

    <g transform="translate(620 134)">
      <rect width="248" height="174" rx="22" fill="#20252A" stroke="#363D42"/>
      <circle cx="37" cy="37" r="17" fill="#79B9FF"/>
      <rect x="29" y="30" width="16" height="13" rx="2" fill="none" stroke="#0A2136" stroke-width="2.3"/>
      <text x="66" y="45" fill="#F4F6F5" font-size="23" font-weight="700">Приложение</text>
      <text x="24" y="92" fill="#CFD4D2" font-size="19">Активное окно</text>
      <text x="24" y="120" fill="#CFD4D2" font-size="19">выбирает контекст</text>
      <text x="24" y="151" fill="#8F9894" font-size="17">или глобальное кольцо</text>
    </g>

    <g transform="translate(908 134)">
      <rect width="248" height="174" rx="22" fill="#2C274D" stroke="#6651B8"/>
      <circle cx="37" cy="37" r="17" fill="#F3A66A"/>
      <path d="M30 37l5 5 10-12" fill="none" stroke="#2A1608" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="45" fill="#F4F6F5" font-size="23" font-weight="700">Кольцо</text>
      <text x="24" y="92" fill="#DED8FF" font-size="19">Навести и выполнить</text>
      <text x="24" y="120" fill="#DED8FF" font-size="19">или раскрыть папку</text>
      <text x="24" y="151" fill="#B9AFE5" font-size="17">дочерняя дуга действий</text>
    </g>
  </g>
</svg>
